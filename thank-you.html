<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="robots" content="noindex,follow">
 <title>Enquiry Sent | NOV PETS</title>
 <link rel="stylesheet" href="styles.css">
 <style>
  .success-page{min-height:100svh;display:flex;flex-direction:column;background:#fff}
  .success-header{padding:32px 5.5%}
  .success-main{flex:1;display:grid;place-items:center;padding:36px 24px 100px}
  .success-message{text-align:center;max-width:500px}
  .success-mark{width:64px;height:64px;border-radius:50%;background:#edf5ef;color:var(--ink);display:grid;place-items:center;margin:0 auto 28px}
  .success-message h1{font-size:clamp(38px,6vw,56px);margin-bottom:20px}
  .success-message p{font-size:17px;color:var(--muted);line-height:1.7}
  .success-message .button{margin-top:32px;min-width:160px}
  @media(max-width:600px){.success-header{padding:24px}.success-main{padding-bottom:72px}.success-message p{font-size:15px}}
 </style>
</head>
<body class="success-page">
 <header class="success-header"><a href="index.html" class="logo" aria-label="NOV PETS home"><span class="brand-image"><img src="assets/novpets-logo-web.png" width="650" height="217" alt="NOVpets"></span></a></header>
 <main class="success-main"><div class="success-message">
  <div class="success-mark" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="m5 12 4 4L19 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h1>Enquiry sent.</h1>
  <p>Thank you for getting in touch.<br>We’ll be in touch soon.</p>
  <a class="button orange" href="index.html">Back to home</a>
 </div></main>
</body>
</html>
